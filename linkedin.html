<!--
  Vstupní adresa pro odkaz „Featured" na LinkedInu: tomaspetera.cz/linkedin

  LinkedIn si u vloženého odkazu ukládá „kanonickou" adresu stránky. Úvodní
  stránka má kanonickou adresu bez značek, takže z odkazu
  tomaspetera.cz/?utm_source=linkedin zbylo vždy jen tomaspetera.cz a v měření
  nešlo poznat, že návštěvník přišel z LinkedInu.

  Tahle stránka proto ZÁMĚRNĚ nemá kanonickou adresu (značku link canonical)
  ani adresu pro sdílení (og url). Nepřidávej je sem. Návštěvníka
  hned pošle na úvodní stránku se značkou zdroje. Náhled odkazu (titulek,
  popis, obrázek) je stejný jako u úvodní stránky. Sama se neměří, ať se
  návštěva nepočítá dvakrát.
-->
